name: Release

# Two steps, with a pull request between them, as in the Java and Rust SDKs. CONTRIBUTING.md
# ("Release a version") has the steps and the one-time setup.
#
# 1. A manual run (Actions > Release > Run workflow) with `patch` (the default), `minor`, `major` or
#    an exact version X.Y.Z opens the pull request "Release vX.Y.Z". It sets the version in every
#    go.mod file that requires one of the three modules, and dates the [Unreleased] section of the
#    CHANGELOG (`go run ./scripts/release prepare`). A pull request that GITHUB_TOKEN opens starts
#    no workflow, so the run starts ci.yml and the two compatibility workflows on the release
#    branch itself. Together they hold every required status check of main.
# 2. The merge of that pull request into main publishes the version: when one of the three tags of
#    the version of the go.mod files is missing and the CHANGELOG has its dated section
#    (`go run ./scripts/release status`), the run waits for the three workflows on the merge
#    commit, creates the tags vX.Y.Z, mcpgo/vX.Y.Z and officialsdk/vX.Y.Z on it, waits until the Go
#    module proxy serves both adapters at the new version, and then creates the GitHub release of
#    vX.Y.Z. A failed step publishes nothing after it, and a re-run of the failed jobs continues the
#    release: a tag that is already on the merge commit is a skip.
#
# A Go module has no registry upload: a version is a git tag, and the Go module proxy reads it
# from this public repository. So the release needs no publishing secret at all. GITHUB_TOKEN
# creates the tags. The proxy keeps a version for good: a bad tag needs a new version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, or an exact version X.Y.Z
        required: true
        default: patch
        type: string
  push:
    branches: [main]
    paths:
      - mcpgo/go.mod
      - officialsdk/go.mod
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: The run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release workflow on main, not on $GITHUB_REF_NAME"
          exit 1
      # The full history holds the tags that the next version counts from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # scripts/release needs only the standard library. No cache: a release job restores
      # nothing that another run wrote.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Set the version and date the CHANGELOG
        id: prepare
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(go run ./scripts/release prepare "$INPUT" "$(date -u +%F)")"
          # A tag of a module version never moves, and the Go proxy keeps a version for good.
          for tag in "v$version" "mcpgo/v$version" "officialsdk/v$version"; do
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::The repository already has the tag $tag"
              exit 1
            fi
          done
          # The step reads the list of the versions that the proxy has. A request for the version
          # itself makes the proxy keep a "not found" answer for up to 30 minutes, and that delays
          # the release.
          for module in go.agentcat.com/sdk/v2 go.agentcat.com/sdk/mcpgo/v2 go.agentcat.com/sdk/officialsdk/v2; do
            if ! versions="$(curl -sSf "https://proxy.golang.org/$module/@v/list")"; then
              echo "::error::The Go proxy did not list the versions of $module. Try again later"
              exit 1
            fi
            if grep -qxF "v$version" <<<"$versions"; then
              echo "::error::The Go proxy already has $module v$version"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add CHANGELOG.md mcpgo/go.mod officialsdk/go.mod examples/*/*/go.mod README.md MIGRATION.md
          git commit -m "Release v$VERSION"
          git push origin "$branch"
          go run ./scripts/release notes "$VERSION" > notes.md
          {
            echo "Merging this pull request tags \`v$VERSION\`, \`mcpgo/v$VERSION\` and \`officialsdk/v$VERSION\` for the Go module proxy, then creates the GitHub release \`v$VERSION\` with these notes:"
            echo
            cat notes.md
          } > body.md
          gh pr create --base main --head "$branch" --title "Release v$VERSION" --body-file body.md
          gh workflow run ci.yml --ref "$branch"
          gh workflow run go-sdk-compatibility.yml --ref "$branch"
          gh workflow run mcp-go-compatibility.yml --ref "$branch"

  status:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.status.outputs.version }}
      publish: ${{ steps.status.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Is this version released?
        id: status
        run: |
          set -euo pipefail
          # The assignment, unlike a here-string, stops the step when the status step fails.
          result="$(go run ./scripts/release status)"
          read -r version action <<<"$result"
          echo "agentcat-go-sdk $version: $action"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$action" = publish ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: status
    if: needs.status.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # The same environment as the other SDKs: only main can deploy to it.
    environment:
      name: release
      url: https://pkg.go.dev/go.agentcat.com/sdk/v2@v${{ needs.status.outputs.version }}
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      # The runs of this push to main check the commit on Go stable and 1.24 (ci.yml) and on every
      # supported version of both MCP libraries (the compatibility workflows); they hold the
      # required status checks of main. The tags go out only when all three pass.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 85); do
            pending=0
            for workflow in ci.yml go-sdk-compatibility.yml mcp-go-compatibility.yml; do
              read -r status conclusion <<<"$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push" \
                --jq '.workflow_runs | sort_by(.run_attempt) | last | "\(.status // "none") \(.conclusion // "none")"')"
              if [ "$status" != completed ]; then
                pending=1
              elif [ "$conclusion" != success ]; then
                echo "::error::$workflow on $GITHUB_SHA ended with $conclusion; re-run it, then re-run this job"
                exit 1
              fi
            done
            if [ "$pending" = 0 ]; then
              echo "CI passed on $GITHUB_SHA"
              exit 0
            fi
            sleep 60
          done
          echo "::error::CI on $GITHUB_SHA did not finish in time"
          exit 1
      # The root tag first, so that the adapters have something to resolve against. A re-run after
      # a tag that went through skips that tag. A tag on another commit stops the job: a tag of a
      # module version never moves.
      - name: Tag the three modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY"
          for tag in "v$VERSION" "mcpgo/v$VERSION" "officialsdk/v$VERSION"; do
            # An annotated tag names its commit on the ^{} line, a lightweight tag on its own line.
            commit="$(git ls-remote "$url" "refs/tags/$tag" "refs/tags/$tag^{}" \
              | awk -v ref="refs/tags/$tag" '$2 == ref "^{}" { peeled = $1 } $2 == ref { plain = $1 } END { print (peeled != "" ? peeled : plain) }')"
            if [ -z "$commit" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --silent
              echo "Created the tag $tag on $GITHUB_SHA"
            elif [ "$commit" = "$GITHUB_SHA" ]; then
              echo "The tag $tag is already on $GITHUB_SHA"
            else
              echo "::error::The tag $tag is on $commit, not on $GITHUB_SHA; a tag never moves, so release a new version"
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # Step 3 of the old manual recipe: outside this repository the replace directives do not
      # apply, so this is the check that the published requires resolve. The proxy can keep a
      # "not found" answer for up to 30 minutes when something asked for this version before the
      # tag existed, so the step tries for 40 minutes.
      - name: The Go proxy serves both adapters
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          go mod init check
          for _ in $(seq 1 40); do
            if go get "go.agentcat.com/sdk/mcpgo/v2@v$VERSION" && go get "go.agentcat.com/sdk/officialsdk/v2@v$VERSION"; then
              root="$(go list -m -f '{{.Version}}' go.agentcat.com/sdk/v2)"
              if [ "$root" != "v$VERSION" ]; then
                echo "::error::The adapters v$VERSION resolve the root module at $root, not at v$VERSION"
                exit 1
              fi
              echo "The Go proxy serves go.agentcat.com/sdk/mcpgo/v2 and go.agentcat.com/sdk/officialsdk/v2 v$VERSION"
              exit 0
            fi
            sleep 60
          done
          echo "::error::The Go proxy did not serve both adapters v$VERSION in time"
          exit 1

  github-release:
    needs: [status, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # The publish job created the tag. A re-run after a release that went through skips it.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The GitHub release v$VERSION exists already"
            exit 0
          fi
          go run ./scripts/release notes "$VERSION" > notes.md
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md
