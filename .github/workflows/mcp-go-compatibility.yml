name: mcp-go Compatibility Testing

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # Decides whether this PR touches SDK code. The compat jobs below hold
  # required status checks, so they are skipped (which satisfies the check)
  # instead of filtering the whole workflow with on.pull_request.paths.
  changes:
    name: Detect SDK code changes
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - name: Check out code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request: running compat tests"
            echo "sdk=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          # SDK code: root package, shared internals, the mcpgo adapter
          # module, the Go manifests, and this workflow. Markdown is never SDK code.
          SDK_RE='^([^/]+\.go|go\.mod|go\.sum|internal/.+|mcpgo/.+|\.github/workflows/mcp-go-compatibility\.yml)$'
          if echo "$CHANGED" | grep -v '\.md$' | grep -qE "$SDK_RE"; then
            echo "SDK code changed: running compat tests"
            echo "sdk=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SDK code changed: skipping compat tests"
            echo "sdk=false" >> "$GITHUB_OUTPUT"
          fi

  discover-versions:
    name: Discover mcp-go versions
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
      version-count: ${{ steps.get-versions.outputs.version-count }}
    steps:
      - name: Get mcp-go versions
        id: get-versions
        run: |
          echo "Fetching tags from mark3labs/mcp-go..."
          TAGS=$(git ls-remote --tags https://github.com/mark3labs/mcp-go.git | \
                 grep -v '\^{}' | \
                 awk '{print $2}' | \
                 sed 's#refs/tags/##' | \
                 grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')

          echo "Found $(echo "$TAGS" | wc -l) total tags"

          VERSIONS=$(echo "$TAGS" | \
            awk -F'[.v]' '
            {
              major = $2
              minor = $3
              patch = $4
              if (major == 0 && minor >= 53) {
                minor_key = major "." minor
                full_version = major "." minor "." patch
                if (!(minor_key in latest_patch) || patch > latest_patch[minor_key]) {
                  latest_patch[minor_key] = patch
                  latest[minor_key] = full_version
                }
              }
            }
            END {
              n = asorti(latest, sorted)
              printf "["
              for (i = 1; i <= n; i++) {
                if (i > 1) printf ","
                printf "\"" latest[sorted[i]] "\""
              }
              printf "]"
            }')

          echo "Filtered versions (>= v0.53.0, latest patch per minor):"
          echo "$VERSIONS" | jq -r '.[]' | sort -V

          VERSION_COUNT=$(echo "$VERSIONS" | jq '. | length')
          echo "Total versions to test: $VERSION_COUNT"

          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "version-count=$VERSION_COUNT" >> $GITHUB_OUTPUT

  test:
    name: Test with mcp-go v${{ matrix.version }}
    needs: discover-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover-versions.outputs.versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Update mcp-go to v${{ matrix.version }}
        working-directory: ./mcpgo
        run: |
          echo "Updating mcp-go to v${{ matrix.version }}..."
          go get github.com/mark3labs/mcp-go@v${{ matrix.version }}
          go mod tidy

          echo "Current mcp-go version:"
          go list -m github.com/mark3labs/mcp-go

      - name: Run tests
        working-directory: ./mcpgo
        run: |
          # The compat tripwire asserts that mcpgo/compat.go's shims RESOLVE,
          # which is only meaningful on the version go.mod pins. Every matrix
          # entry below it is deliberately older, where absence is the correct
          # answer, so the tripwire is excluded. Behavior on those versions is
          # covered by the untagged tests, which gate on capability instead.
          MINOR=$(echo "${{ matrix.version }}" | cut -d. -f2)
          TAGS=""
          if [ "$MINOR" -lt 57 ]; then
            TAGS="-tags mcpgo_legacy"
            echo "mcp-go v${{ matrix.version }} is older than the pinned version: excluding the pinned-version tripwire"
          fi
          echo "Running mcpgo test suite with mcp-go v${{ matrix.version }}..."
          go test -v -race $TAGS ./...

      - name: Test result
        if: success()
        run: echo "All tests passed with mcp-go v${{ matrix.version }}"

  summary:
    name: Compatibility Test Summary
    needs: [changes, discover-versions, test]
    runs-on: ubuntu-latest
    # Skipped on PRs without SDK code (a skipped required check passes). It
    # still runs, and fails, if the changes job itself failed.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.sdk == 'true' ||
       needs.changes.result != 'success')
    steps:
      - name: Check test results
        run: |
          echo "Tested against ${{ needs.discover-versions.outputs.version-count }} mcp-go versions"
          echo ""
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "All compatibility tests passed!"
          else
            echo "Some compatibility tests failed"
            exit 1
          fi
