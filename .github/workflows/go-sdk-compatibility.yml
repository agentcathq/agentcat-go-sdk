name: go-sdk Compatibility Testing

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # Decides whether this PR touches SDK code. The compat jobs below hold
  # required status checks, so they are skipped (which satisfies the check)
  # instead of filtering the whole workflow with on.pull_request.paths.
  changes:
    name: Detect SDK code changes
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - name: Check out code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request: running compat tests"
            echo "sdk=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          # SDK code: root package, shared internals, the officialsdk adapter
          # module, the Go manifests, and this workflow. Markdown is never SDK code.
          SDK_RE='^([^/]+\.go|go\.mod|go\.sum|internal/.+|officialsdk/.+|\.github/workflows/go-sdk-compatibility\.yml)$'
          if echo "$CHANGED" | grep -v '\.md$' | grep -qE "$SDK_RE"; then
            echo "SDK code changed: running compat tests"
            echo "sdk=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SDK code changed: skipping compat tests"
            echo "sdk=false" >> "$GITHUB_OUTPUT"
          fi

  discover-versions:
    name: Discover go-sdk versions
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
      version-count: ${{ steps.get-versions.outputs.version-count }}
    steps:
      - name: Get go-sdk versions
        id: get-versions
        run: |
          echo "Fetching tags from modelcontextprotocol/go-sdk..."
          TAGS=$(git ls-remote --tags https://github.com/modelcontextprotocol/go-sdk.git | \
                 grep -v '\^{}' | \
                 awk '{print $2}' | \
                 sed 's#refs/tags/##' | \
                 grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')

          echo "Found $(echo "$TAGS" | wc -l) total tags"

          VERSIONS=$(echo "$TAGS" | \
            awk -F'[.v]' '
            {
              major = $2
              minor = $3
              patch = $4
              if ((major == 1 && minor >= 4) || major > 1) {
                minor_key = major "." minor
                full_version = major "." minor "." patch
                if (!(minor_key in latest_patch) || patch > latest_patch[minor_key]) {
                  latest_patch[minor_key] = patch
                  latest[minor_key] = full_version
                }
              }
            }
            END {
              n = asorti(latest, sorted)
              printf "["
              for (i = 1; i <= n; i++) {
                if (i > 1) printf ","
                printf "\"" latest[sorted[i]] "\""
              }
              printf "]"
            }')

          echo "Filtered versions (>= v1.4.0, latest patch per minor):"
          echo "$VERSIONS" | jq -r '.[]' | sort -V

          VERSION_COUNT=$(echo "$VERSIONS" | jq '. | length')
          echo "Total versions to test: $VERSION_COUNT"

          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "version-count=$VERSION_COUNT" >> $GITHUB_OUTPUT

  test:
    name: Test with go-sdk v${{ matrix.version }}
    needs: discover-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover-versions.outputs.versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Update go-sdk to v${{ matrix.version }}
        working-directory: ./officialsdk
        run: |
          echo "Updating go-sdk to v${{ matrix.version }}..."
          go get github.com/modelcontextprotocol/go-sdk@v${{ matrix.version }}
          go mod tidy

          echo "Current go-sdk version:"
          go list -m github.com/modelcontextprotocol/go-sdk

      - name: Run tests
        working-directory: ./officialsdk
        run: |
          # MCP multi-round-trip arrived in go-sdk v1.7.0. The adapter detects
          # its absence at runtime (officialsdk/compat.go), but the MRTR tests
          # build mcp.InputRequestMap / InputResponseMap literals that no shim
          # can stand in for, so they are excluded below v1.7.0. Keyed on the
          # minor version, not an exact string, so v1.8.0+ keeps full coverage.
          MAJOR=$(echo "${{ matrix.version }}" | cut -d. -f1)
          MINOR=$(echo "${{ matrix.version }}" | cut -d. -f2)
          TAGS=""
          if [ "$MAJOR" -eq 1 ] && [ "$MINOR" -lt 7 ]; then
            TAGS="-tags gosdk_legacy"
            echo "go-sdk v${{ matrix.version }} predates MRTR: excluding MRTR tests"
          fi
          echo "Running officialsdk test suite with go-sdk v${{ matrix.version }}..."
          go test -v -race $TAGS ./...

      - name: Test result
        if: success()
        run: echo "All tests passed with go-sdk v${{ matrix.version }}"

  summary:
    name: Compatibility Test Summary
    needs: [changes, discover-versions, test]
    runs-on: ubuntu-latest
    # Skipped on PRs without SDK code (a skipped required check passes). It
    # still runs, and fails, if the changes job itself failed.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.sdk == 'true' ||
       needs.changes.result != 'success')
    steps:
      - name: Check test results
        run: |
          echo "Tested against ${{ needs.discover-versions.outputs.version-count }} go-sdk versions"
          echo ""
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "All compatibility tests passed!"
          else
            echo "Some compatibility tests failed"
            exit 1
          fi
